    <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.03em" fill="#0f172a">AEVIA</text>
    <text x="146" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="38" font-weight="300" letter-spacing="0.04em" fill="#0e7490">KONSULT</text>
    <text x="2" y="58" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.22em" fill="#64748b" text-transform="uppercase">Clinical Sanctuary &amp; Telehealth Matrix</text>
